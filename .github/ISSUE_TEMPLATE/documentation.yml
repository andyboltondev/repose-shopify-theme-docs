name: Documentation
description: Something is missing from the documentation, unclear, or does not match the theme.
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Which documentation page, or the topic you were looking for if there is no page yet.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong
    validations:
      required: true
